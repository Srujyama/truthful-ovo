# Truthful on Fly.io: one machine, one volume for the SQLite books.
app = "truthful-ovo"
primary_region = "sjc"

[build]

[env]
  PUBLIC_ORIGIN = "https://truthful-ovo.fly.dev"
  DATA_DIR = "/data/managed"

[[mounts]]
  source = "truthful_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
